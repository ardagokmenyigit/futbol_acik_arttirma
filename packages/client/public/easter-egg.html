<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easter Egg 🎁</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background:
          radial-gradient(
            ellipse 700px 460px at 15% -8%,
            rgba(201, 151, 74, 0.15),
            transparent 60%
          ),
          radial-gradient(ellipse 640px 520px at 92% 6%, rgba(62, 110, 147, 0.15), transparent 55%),
          #071613;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #f2efe6;
      }
      .container {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 32px;
        max-width: 1200px;
        width: 100%;
      }
      .card {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #10241f;
        border: 2px solid rgba(201, 151, 74, 0.35);
        border-radius: 16px;
        padding: 12px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
        transition:
          transform 0.25s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease;
      }
      .card:hover {
        transform: translateY(-4px) scale(1.02);
        border-color: #c9974a;
        box-shadow: 0 16px 40px rgba(201, 151, 74, 0.25);
      }
      .card img {
        width: 100%;
        height: clamp(320px, 72vh, 680px);
        object-fit: contain;
        border-radius: 10px;
        display: block;
      }
      @media (max-width: 768px) {
        .container {
          flex-direction: column;
          gap: 20px;
        }
        .card img {
          height: auto;
          max-height: 50vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img src="/easter-1.jpg" alt="Easter Egg 1" />
      </div>
      <div class="card">
        <img src="/easter-2.jpg" alt="Easter Egg 2" />
      </div>
    </div>
  </body>
</html>
